<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘルス＆フィットネスログ</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* カスタムスクロールバー & モバイル調整 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        input, select, textarea {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border-color: #333333 !important;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #10b981 !important;
            outline: none !important;
        }
    </style>
</head>
<body class="pb-24">

    <!-- ヘッダー / ナビゲーション -->
    <header class="sticky top-0 z-50 bg-gray-900/90 backdrop-blur border-b border-gray-800">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-emerald-400">Health Tracker</h1>
            <div class="flex gap-2 bg-gray-800 p-1 rounded-lg">
                <button id="nav-record-btn" onclick="switchTab('record')" class="px-3 py-1 text-sm font-semibold rounded-md bg-emerald-600 text-white transition">記録</button>
                <button id="nav-stats-btn" onclick="switchTab('stats')" class="px-3 py-1 text-sm font-semibold rounded-md text-gray-400 hover:text-white transition">推移</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- ==================== 1. 記録タブ ==================== -->
        <section id="tab-record" class="space-y-5">
            <!-- 日付選択 -->
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                <label for="entry-date" class="font-medium text-sm text-gray-300">対象日付</label>
                <input type="date" id="entry-date" onchange="loadDateData()" class="px-3 py-1.5 rounded-lg border text-sm font-semibold">
            </div>

            <form id="health-form" onsubmit="saveData(event)" class="space-y-4">
                
                <!-- 睡眠時間 & 体重 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 space-y-1">
                        <label class="block text-xs text-gray-400">睡眠時間 (時間)</label>
                        <input type="number" id="sleep" step="0.1" min="0" max="24" placeholder="7.5" class="w-full px-3 py-2 rounded-lg border text-base">
                    </div>
                    <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 space-y-1">
                        <label class="block text-xs text-gray-400">体重 (kg)</label>
                        <input type="number" id="weight" step="0.1" min="0" placeholder="65.0" class="w-full px-3 py-2 rounded-lg border text-base">
                    </div>
                </div>

                <!-- 体調スコア & 体調メモ -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">体調スコア (1:悪い 〜 5:良い)</label>
                        <select id="condition" class="w-full px-3 py-2 rounded-lg border text-sm">
                            <option value="5">5 - 絶好調</option>
                            <option value="4">4 - 良好</option>
                            <option value="3" selected>3 - 普通</option>
                            <option value="2">2 - やや不調</option>
                            <option value="1">1 - 不調</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">体調メモ</label>
                        <input type="text" id="condition-note" placeholder="頭痛あり、身体が軽い等" class="w-full px-3 py-2 rounded-lg border text-sm">
                    </div>
                </div>

                <!-- 食事記録 -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                    <label class="block text-xs text-gray-400">食事記録</label>
                    <textarea id="meals" rows="3" placeholder="朝: プロテイン&#10;昼: 定食&#10;夜: サラダ、蒸し鶏" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                </div>

                <!-- トレーニング -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-gray-400">トレーニング</label>
                        <button type="button" onclick="copyYesterdayTraining()" class="text-xs bg-gray-800 hover:bg-gray-700 text-emerald-400 px-2.5 py-1 rounded-md border border-gray-700 transition">
                            前日の内容をコピー
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-4 py-1">
                        <label class="inline-flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="workout-status" value="done" class="accent-emerald-500" checked>
                            <span class="text-sm">実施</span>
                        </label>
                        <label class="inline-flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="workout-status" value="off" class="accent-emerald-500">
                            <span class="text-sm text-gray-400">未実施 (Off)</span>
                        </label>
                    </div>

                    <textarea id="workout-detail" rows="3" placeholder="ベンチプレス 60kg 10x3&#10;ランニング 5km" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                </div>

                <!-- メモ / ジャーナル -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                    <label class="block text-xs text-gray-400">ジャーナル / 日記メモ</label>
                    <textarea id="journal" rows="3" placeholder="今日の振り返りや気づいたこと" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                </div>

                <!-- 保存ボタン -->
                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-xl shadow-lg transition active:scale-[0.98]">
                    保存する（上書き）
                </button>
            </form>
        </section>


        <!-- ==================== 2. 推移タブ ==================== -->
        <section id="tab-stats" class="hidden space-y-5">
            <!-- 期間切替ボタン -->
            <div class="bg-gray-900 p-1.5 rounded-xl border border-gray-800 flex gap-2">
                <button id="range-week-btn" onclick="setRange('week')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition">直近1週間</button>
                <button id="range-month-btn" onclick="setRange('month')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition">今月（1日〜末日）</button>
            </div>

            <!-- サマリー（平均値） -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                    <span class="block text-xs text-gray-400">体重平均</span>
                    <span id="avg-weight" class="text-xl font-bold text-emerald-400">-- <span class="text-xs text-gray-400">kg</span></span>
                </div>
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                    <span class="block text-xs text-gray-400">体調平均</span>
                    <span id="avg-condition" class="text-xl font-bold text-emerald-400">-- <span class="text-xs text-gray-400">/ 5</span></span>
                </div>
            </div>

            <!-- 体重グラフ -->
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="text-xs font-semibold text-gray-400">体重推移 (kg)</h3>
                <div class="relative w-full h-56">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>

            <!-- 体調グラフ -->
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                <h3 class="text-xs font-semibold text-gray-400">体調推移 (5段階)</h3>
                <div class="relative w-full h-48">
                    <canvas id="conditionChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-500 text-gray-950 font-bold text-sm px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-50">
        保存しました
    </div>

    <script>
        const STORAGE_KEY = 'health_tracker_data_v1';
        let weightChartInstance = null;
        let conditionChartInstance = null;
        let currentRangeMode = 'week'; // 'week' | 'month'

        // JST基準の本日日付(YYYY-MM-DD)を取得
        function getTodayJST() {
            const now = new Date();
            // JSTに補正
            const jstOffset = 9 * 60;
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const jstDate = new Date(utc + (jstOffset * 60000));
            
            const year = jstDate.getFullYear();
            const month = String(jstDate.getMonth() + 1).padStart(2, '0');
            const day = String(jstDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 全データ取得
        function getAllData() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('entry-date');
            dateInput.value = getTodayJST();
            loadDateData();
        });

        // 指定日付のデータをフォームにロード
        function loadDateData() {
            const date = document.getElementById('entry-date').value;
            const data = getAllData()[date] || {};

            document.getElementById('sleep').value = data.sleep ?? '';
            document.getElementById('weight').value = data.weight ?? '';
            document.getElementById('condition').value = data.condition ?? '3';
            document.getElementById('condition-note').value = data.conditionNote ?? '';
            document.getElementById('meals').value = data.meals ?? '';
            document.getElementById('workout-detail').value = data.workoutDetail ?? '';
            document.getElementById('journal').value = data.journal ?? '';

            const statusRadios = document.getElementsByName('workout-status');
            const statusValue = data.workoutStatus || 'done';
            for (const radio of statusRadios) {
                radio.checked = (radio.value === statusValue);
            }
        }

        // 保存処理
        function saveData(e) {
            e.preventDefault();
            const date = document.getElementById('entry-date').value;
            if (!date) return;

            const workoutStatus = Array.from(document.getElementsByName('workout-status'))
                .find(r => r.checked)?.value || 'done';

            const entryData = {
                sleep: document.getElementById('sleep').value ? parseFloat(document.getElementById('sleep').value) : null,
                weight: document.getElementById('weight').value ? parseFloat(document.getElementById('weight').value) : null,
                condition: parseInt(document.getElementById('condition').value, 10),
                conditionNote: document.getElementById('condition-note').value.trim(),
                meals: document.getElementById('meals').value.trim(),
                workoutStatus: workoutStatus,
                workoutDetail: document.getElementById('workout-detail').value.trim(),
                journal: document.getElementById('journal').value.trim()
            };

            const allData = getAllData();
            allData[date] = entryData;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));

            showToast('データを保存しました');
        }

        // 前日のトレーニング内容をコピー
        function copyYesterdayTraining() {
            const currentDateVal = document.getElementById('entry-date').value;
            if (!currentDateVal) return;

            const currentDate = new Date(currentDateVal);
            currentDate.setDate(currentDate.getDate() - 1);

            const yyyy = currentDate.getFullYear();
            const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
            const dd = String(currentDate.getDate()).padStart(2, '0');
            const yesterdayStr = `${yyyy}-${mm}-${dd}`;

            const allData = getAllData();
            const yesterdayData = allData[yesterdayStr];

            if (yesterdayData && yesterdayData.workoutDetail) {
                document.getElementById('workout-detail').value = yesterdayData.workoutDetail;
                if (yesterdayData.workoutStatus) {
                    const statusRadios = document.getElementsByName('workout-status');
                    for (const radio of statusRadios) {
                        radio.checked = (radio.value === yesterdayData.workoutStatus);
                    }
                }
                showToast('前日のトレーニングをコピーしました');
            } else {
                showToast('前日のトレーニング記録がありません');
            }
        }

        // タブ切り替え
        function switchTab(tab) {
            const recTab = document.getElementById('tab-record');
            const statsTab = document.getElementById('tab-stats');
            const recBtn = document.getElementById('nav-record-btn');
            const statsBtn = document.getElementById('nav-stats-btn');

            if (tab === 'record') {
                recTab.classList.remove('hidden');
                statsTab.classList.add('hidden');
                recBtn.className = "px-3 py-1 text-sm font-semibold rounded-md bg-emerald-600 text-white transition";
                statsBtn.className = "px-3 py-1 text-sm font-semibold rounded-md text-gray-400 hover:text-white transition";
            } else {
                recTab.classList.add('hidden');
                statsTab.classList.remove('hidden');
                statsBtn.className = "px-3 py-1 text-sm font-semibold rounded-md bg-emerald-600 text-white transition";
                recBtn.className = "px-3 py-1 text-sm font-semibold rounded-md text-gray-400 hover:text-white transition";
                renderCharts();
            }
        }

        // 範囲切替（推移タブ）
        function setRange(mode) {
            currentRangeMode = mode;
            const weekBtn = document.getElementById('range-week-btn');
            const monthBtn = document.getElementById('range-month-btn');

            if (mode === 'week') {
                weekBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition";
                monthBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition";
            } else {
                monthBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-600 text-white transition";
                weekBtn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition";
            }
            renderCharts();
        }

        // グラフ用日付リストの生成
        function getDateRange() {
            const todayStr = getTodayJST();
            const today = new Date(todayStr);
            const dates = [];

            if (currentRangeMode === 'week') {
                // 本日を最終日とする直近7日間
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(today);
                    d.setDate(d.getDate() - i);
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    dates.push(`${yyyy}-${mm}-${dd}`);
                }
            } else {
                // 本日が含まれる月の1日〜末日
                const year = today.getFullYear();
                const month = today.getMonth(); // 0-indexed
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);

                for (let d = new Date(firstDay); d <= lastDay; d.setDate(d.getDate() + 1)) {
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    dates.push(`${yyyy}-${mm}-${dd}`);
                }
            }
            return dates;
        }

        // グラフ描画
        function renderCharts() {
            const dates = getDateRange();
            const allData = getAllData();

            const weightData = [];
            const conditionData = [];

            let weightSum = 0;
            let weightCount = 0;
            let conditionSum = 0;
            let conditionCount = 0;

            dates.forEach(date => {
                const item = allData[date];
                if (item && item.weight !== null && item.weight !== undefined) {
                    weightData.push(item.weight);
                    weightSum += item.weight;
                    weightCount++;
                } else {
                    weightData.push(null);
                }

                if (item && item.condition !== null && item.condition !== undefined) {
                    conditionData.push(item.condition);
                    conditionSum += item.condition;
                    conditionCount++;
                } else {
                    conditionData.push(null);
                }
            });

            // 平均値算出表示
            const avgWeightEl = document.getElementById('avg-weight');
            const avgConditionEl = document.getElementById('avg-condition');

            avgWeightEl.innerHTML = weightCount > 0 
                ? `${(weightSum / weightCount).toFixed(1)} <span class="text-xs text-gray-400">kg</span>`
                : `-- <span class="text-xs text-gray-400">kg</span>`;

            avgConditionEl.innerHTML = conditionCount > 0 
                ? `${(conditionSum / conditionCount).toFixed(1)} <span class="text-xs text-gray-400">/ 5</span>`
                : `-- <span class="text-xs text-gray-400">/ 5</span>`;

            const labels = dates.map(d => d.slice(5).replace('-', '/')); // MM/DD表記

            // Chart.js 設定
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                spanGaps: true, // 欠損値を線で繋ぐ
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        ticks: { color: '#888888', font: { size: 10 } },
                        grid: { color: '#222222' }
                    },
                    y: {
                        ticks: { color: '#888888', font: { size: 10 } },
                        grid: { color: '#222222' }
                    }
                }
            };

            // 体重グラフ
            if (weightChartInstance) weightChartInstance.destroy();
            const ctxWeight = document.getElementById('weightChart').getContext('2d');
            weightChartInstance = new Chart(ctxWeight, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: weightData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#10b981',
                        fill: true
                    }]
                },
                options: chartOptions
            });

            // 体調グラフ
            if (conditionChartInstance) conditionChartInstance.destroy();
            const ctxCondition = document.getElementById('conditionChart').getContext('2d');
            const condOptions = JSON.parse(JSON.stringify(chartOptions));
            condOptions.scales.y.min = 1;
            condOptions.scales.y.max = 5;
            condOptions.scales.y.ticks.stepSize = 1;

            conditionChartInstance = new Chart(ctxCondition, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: conditionData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#3b82f6',
                        fill: true
                    }]
                },
                options: condOptions
            });
        }

        // 簡易トースト表示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
